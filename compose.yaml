services:
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "54222:4222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - 'http://localhost:8222/healthz?js-enabled-only=true' >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 15

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: session
      POSTGRES_PASSWORD: session
      POSTGRES_DB: session
    ports:
      - "54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U session -d session"]
      interval: 2s
      timeout: 5s
      retries: 15

  migrate:
    build: .
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://session:session@postgres:5432/session?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build: .
    environment:
      SESSION_STORAGE: postgres
      DATABASE_URL: postgres://session:session@postgres:5432/session?sslmode=disable
      EVENT_STREAM_DRIVER: nats
      NATS_URL: nats://nats:4222
      NATS_STREAM: SESSION_EVENTS
      NATS_SUBJECT: sessions.events
      NATS_CONSUMER: session-handler
      NATS_DLQ_SUBJECT: sessions.events.dlq
      HTTP_ADDR: :8080
    ports:
      - "58080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/readyz >/dev/null"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped

volumes:
  nats-data:
  postgres-data:
