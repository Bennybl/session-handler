services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: session
      POSTGRES_PASSWORD: session
      POSTGRES_DB: session
    ports:
      - "54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U session -d session"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
